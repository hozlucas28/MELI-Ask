lefthook: pnpm exec lefthook
assert_lefthook_installed: true

pre-commit:
  jobs:
    - name: Format and lint files
      group:
        jobs:
          - name: Format with Oxfmt
            run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
            glob:
              - "*.{ts,d.ts}"
              - "*.{json,jsonc,json5}"
              - "*.{md,yml,yaml}"
            stage_fixed: true

          - name: Lint TypeScript files with tsc
            run: pnpm exec tsc --noEmit
            glob:
              - "*.ts"

          - name: Lint TypeScript files applying safe fixes with Oxlint
            run: pnpm exec oxlint --fix {staged_files}
            glob:
              - "*.ts"
            stage_fixed: true

    - name: Lint Dependabot configuration file and GitHub Actions workflows
      group:
        jobs:
          - name: With Zizmor
            run: zizmor --gh-token=$(gh auth token) --persona=auditor --color=never {staged_files}
            glob:
              - .github/dependabot.yaml
              - .github/workflows/*.yaml

          - name: With ActionLint
            run: pnpm exec github-actionlint -ignore 'unexpected key "description" for "workflow" section.' -no-color {staged_files}
            glob:
              - .github/workflows/*.yaml
        parallel: true

    - name: Check spelling
      run: pnpm exec cspell {staged_files} --no-color --no-must-find-files

pre-agent-stop:
  jobs:
    - name: Format and lint files changed by the agent
      group:
        jobs:
          - name: Format with Oxfmt
            run: pnpm exec oxfmt --no-error-on-unmatched-pattern {files}
            glob:
              - "*.{ts,d.ts}"
              - "*.{json,jsonc,json5}"
              - "*.{md,yml,yaml}"

          - name: Lint TypeScript files with tsc
            run: pnpm exec tsc --noEmit
            glob:
              - "*.ts"

          - name: Lint TypeScript files applying safe fixes with Oxlint
            run: pnpm exec oxlint --fix {files}
            glob:
              - "*.ts"

    - name: Lint Dependabot configuration file and GitHub Actions workflows changed by the agent
      group:
        jobs:
          - name: With Zizmor
            run: zizmor --gh-token=$(gh auth token) --persona=auditor --color=never {files}
            glob:
              - .github/dependabot.yaml
              - .github/workflows/*.yaml

          - name: With ActionLint
            run: pnpm exec github-actionlint -ignore 'unexpected key "description" for "workflow" section.' -no-color {files}
            glob:
              - .github/workflows/*.yaml
        parallel: true

    - name: Check spelling in files changed by the agent
      run: pnpm exec cspell {files} --no-color --no-must-find-files

  files: |
    git diff --name-only HEAD --diff-filter=ACMR
    git ls-files --others --exclude-standard
