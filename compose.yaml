name: meli-ask

services:
  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT}:${APP_PORT}"
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_HOST: database # Refers to the database service
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:$${APP_PORT}/health || exit 1"]
      retries: 3
      timeout: 5s
      interval: 5s

  database:
    image: dhi.io/pgvector:0.8-pg18-debian
    container_name: database
    ports:
      - "${DATABASE_PORT}:${DATABASE_PORT}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DATABASE_USER}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"
      POSTGRES_DB: "${DATABASE_APP_DATABASE}"
    env_file:
      - path: .env
        required: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DATABASE_USER} -d $${DATABASE_APP_DATABASE}"]
      retries: 5
      timeout: 5s
      interval: 5s
